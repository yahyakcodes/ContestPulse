spring.application.name=contestpulse

# Local defaults on the right of the colon; every value is overridable by an
# env var of the same name, which is what Phase 8 (deployment) will set.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contestpulse}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the entity classes automatically.
# Fine for a 2-day MVP; a real production app would switch to Flyway
# migrations instead of trusting auto-update -- worth doing in a v2 pass.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Outgoing email (used by EmailNotificationChannel via Spring's
# auto-configured JavaMailSender -- no manual @Bean needed once
# spring.mail.host is set). Defaults target Gmail's SMTP relay.
#
# MAIL_USERNAME must be a full Gmail address; MAIL_PASSWORD must be a Gmail
# "App Password" (NOT your normal Gmail password) -- generate one at
# https://myaccount.google.com/apppasswords, which requires 2-Step
# Verification to be turned on first.
#
# MAIL_USERNAME/MAIL_PASSWORD have no default value on purpose: if they're
# unset, sending fails loudly with an authentication error instead of
# silently pretending to work.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true